# AutoLogger split deployment (containerize-split-images, design D7 / D11).
#   Pangolin -> Newt (host) -> 127.0.0.1:${ROUTER_PORT} -> router -> web | api
#
#   make prod-up     # runs docker/scripts/compose-run.mjs: secrets come from Infisical `prod`
#
# A hand-typed `docker compose up` fails on purpose (docker/secrets-env.yaml's AUTOLOGGER_STACK
# guard). See docs/infisical-secrets.md.
#
# Only `router` publishes a port, and only on host loopback. `web` (front) and `api` (back)
# are on separate networks; only the router joins both, so web cannot reach api.
# `docker compose build` builds the images locally for the native architecture.

name: autologger

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  router:
    # Caddy v2.11.4 (caddy:2), pinned by digest (design D4).
    image: caddy@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    restart: unless-stopped
    init: true
    # Non-root: the image defaults to root; the listener is a high port, so no capability is needed.
    user: "65532:65532"
    read_only: true
    # The caddy binary carries a cap_net_bind_service file capability; exec fails if it is absent
    # from the bounding set, even though we only bind :8080.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /data
      - /config
    ports:
      - "127.0.0.1:${ROUTER_PORT:-8080}:8080"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [front, back]
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      # Loopback-only Caddy admin endpoint (see docker/Caddyfile); not a public path.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging: *logging

  web:
    image: ghcr.io/kwcantrell/autologger-web:${WEB_TAG:?set WEB_TAG in Infisical prod (a git-SHA tag, never latest)}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [front]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *logging

  api:
    image: ghcr.io/kwcantrell/autologger-api:${API_TAG:?set API_TAG in Infisical prod (a git-SHA tag, never latest)}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    # A fixed name blocks `docker compose up --scale api=2`: the hub is single-process.
    container_name: autologger-api
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [back]
    # Secrets and tunables (GOOGLE_*, API_TOKEN, ADMIN_TOKEN, DEEPGRAM_API_KEY, ...) come from the
    # shared allowlist, passed through from Infisical `prod`. The literals in `environment` below
    # win over it, so no Infisical value can flip the posture or relocate the image's paths.
    extends: { file: docker/secrets-env.yaml, service: secrets }
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: "8787"
      YTDLP_PATH: /opt/ytdlp/yt-dlp
      CLAUDE_CLI_PATH: /usr/local/bin/claude
      REQUIRE_LOGIN: "1"
      TRUST_PROXY: "1"
      COOKIE_SECURE: "1"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in Infisical prod to the public https origin}
    volumes:
      - autologger-data:/data
      - autologger-home:/home/node
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/profile').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

networks:
  # Pinned so the router's trusted_proxies (docker/Caddyfile) is stable. Keep the gateways in
  # sync with `trusted_proxies static ...` there.
  front:
    ipam:
      config:
        - subnet: 172.28.10.0/24
          gateway: 172.28.10.1
  back:
    ipam:
      config:
        - subnet: 172.28.11.0/24
          gateway: 172.28.11.1
  # Supabase Postgres (docker/supabase-db.yaml): internal, and the host gets no address on it.
  db:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
    ipam:
      config:
        - subnet: 172.28.12.0/24
  # Supabase services (docker/supabase-services.yaml): internal and host-isolated; only the gateway
  # also joins `edge`, which exists to publish its port.
  supabase:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
    ipam:
      config:
        - subnet: 172.28.13.0/24
  edge:
    ipam:
      config:
        - subnet: 172.28.14.0/24

volumes:
  autologger-data:
  autologger-home:
