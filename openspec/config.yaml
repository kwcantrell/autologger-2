# Merged by agent-lifecycle-template scripts/init.sh. See AGENTS.md.
schema: spec-driven
# The OpenSpec change lifecycle (proposals, tiers, tasks, archive) is retired: work arrives as
# factory jobs. openspec/specs/ stays the living description of behavior; a job that changes
# behavior updates the relevant spec in the same job. scripts/check-change.sh validates the specs.
context: 'openspec/specs/ describes what the system does now. A factory job that changes behavior

  updates the relevant spec in the same job. openspec/changes/archive/ is history; add no new changes.

  '
lifecycle:
  commands:
    test: npm test
    lint: ''
    typecheck: npm run typecheck
    audit: npm audit --audit-level=high
  source_globs:
  - server/src/**
  - web/src/**
  - packages/**
  - companion/src/**
  - server/scripts/**
  test_globs:
  - '**/test/**'
  - '**/tests/**'
  - '**/__tests__/**'
  - '**/*_test.*'
  - '**/*.test.*'
  - '**/*.spec.*'
  - '**/test_*'
  managed_paths:
  - scripts/check-change.sh
  - scripts/sync-skills.sh
  - scripts/lib/check_change.py
  - scripts/lib/adopt.py
  - .claude/hooks/stop-check.sh
  # Paths the pg and integration tests depend on (ci-db-test-selection D1). When a PR changes none,
  # those vitest projects are skipped. Read from the merge-base, like test_globs.
  db_test_paths:
  - server/**
  - packages/**
  - supabase/**
  - test/**
  - docker/**
  - fixtures/**
  - package.json
  - package-lock.json
  - scripts/lib/check_change.py
  - .github/workflows/**
  - openspec/config.yaml
  agent_guide_max_lines: 150
  override_labels:
    tests_with_code: no-test-needed
