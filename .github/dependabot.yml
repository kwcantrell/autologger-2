version: 2
updates:
  # Keeps SHA-pinned actions current; Dependabot updates the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # npm: minor and patch updates grouped weekly; security updates come as their own PRs (ADR 0019).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  # docker: base-image digest bumps for the Dockerfiles under /docker, including the media
  # worker's ffmpeg pin (ARG FFMPEG_IMAGE, media-worker D13). A bump is reviewed as tier 1: the
  # `# reviewed` date moves, blobSegmentRows.ts follows (ffmpegPin.repo.test.ts) and
  # docker/scripts/test_media_image.sh is re-run.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
