# Builds on a version tag and attests the artifacts: SLSA build provenance plus a signed
# SBOM attestation. Verify with `gh attestation verify <file> --repo <owner>/<repo>`.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install pyyaml==6.0.2
      # Stack setup: install the toolchain lifecycle.commands.build needs.
      - name: Build
        run: scripts/check-change.sh --only build
      - name: Resolve artifact path
        id: artifacts
        run: |
          python3 -c "import yaml; print('path=' + yaml.safe_load(open('openspec/config.yaml'))['lifecycle']['release_artifacts'])" >> "$GITHUB_OUTPUT"
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Attest build provenance and SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.artifacts.outputs.path }}
          sbom-path: sbom.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            ${{ steps.artifacts.outputs.path }}
            sbom.spdx.json
