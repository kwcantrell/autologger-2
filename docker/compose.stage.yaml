# AutoLogger STAGE environment (containerized-dev-env, design D5 / D6 / D7 / D13).
# An overlay on the production compose.yaml: same images' build, same routing, same posture
# (TRUST_PROXY=1; login is always required, require-login), served on plain http://localhost:${STAGE_PORT:-8788}
# by default, or behind an HTTPS edge (Cloudflare Tunnel + Access) when the operator passes
# STAGE_PUBLIC_BASE_URL=https://<host> to make (the tunnel connector proxies to 127.0.0.1:STAGE_PORT).
#
# Always invoked from the repo root through the Makefile (docker/scripts/compose-run.mjs), as:
#   WEB_TAG=stage API_TAG=stage PUBLIC_BASE_URL=http://localhost:8788 \
#   docker compose -f compose.yaml -f docker/compose.stage.yaml --env-file /dev/null ...
# The three exported placeholders only satisfy compose.yaml's `${...:?}` guards, which compose
# interpolates before merging; the overlay's own image, PUBLIC_BASE_URL etc. are what take effect.
# Secrets come from the OpenBao `stage` secret (kv/autologger/stage) through prod's allowlist (docker/secrets-env.yaml).
#
# Invariants a future reader must not "helpfully" undo:
#   * Do NOT set TRUST_PROXY here: stage inherits prod's posture unchanged. REQUIRE_LOGIN no
#     longer exists; the server refuses to boot if it is set (require-login D1).
#   * Do NOT mount the host ~/.claude: stage keeps compose.yaml's /home/node named volume
#     (project-scoped, so it is stage's own). AI v2 therefore needs AI_V2_API_KEY, as in prod.
#   * The router publishes ONLY STAGE_PORT on the literal 127.0.0.1; ROUTER_PORT is never used.
#   * ROUTER_FRONT_GW / ROUTER_BACK_GW must equal the network gateways below (single IPv4 each).
#   * No Companion service (the scoped token is tested with curl through the router).
#   * STAGE_WEB_IMAGE, STAGE_API_IMAGE, STAGE_PUBLIC_BASE_URL and STAGE_COOKIE_SECURE are set ONLY
#     by compose-run.mjs from the validated make variables STAGE_IMAGE_TAG / STAGE_PUBLIC_BASE_URL
#     (never from OpenBao: they are not in any allowlist). Unset, they fall back to today's stage:
#     local :local images, http://localhost:STAGE_PORT and COOKIE_SECURE=0.

name: autologger-stage

services:
  router:
    environment:
      ROUTER_FRONT_GW: 172.28.20.1
      ROUTER_BACK_GW: 172.28.21.1
    ports: !override
      - "127.0.0.1:${STAGE_PORT:-8788}:8080"

  web:
    image: ${STAGE_WEB_IMAGE:-autologger-stage-web:local}

  api:
    image: ${STAGE_API_IMAGE:-autologger-stage-api:local}
    container_name: autologger-stage-api
    environment:
      PUBLIC_BASE_URL: ${STAGE_PUBLIC_BASE_URL:-http://localhost:${STAGE_PORT:-8788}}
      COOKIE_SECURE: ${STAGE_COOKIE_SECURE:-0}
      SESSION_COOKIE: autologger_stage_sid

networks:
  front:
    ipam: !override
      config:
        - subnet: 172.28.20.0/24
          gateway: 172.28.20.1
  back:
    ipam: !override
      config:
        - subnet: 172.28.21.0/24
          gateway: 172.28.21.1
  db:
    ipam: !override
      config:
        - subnet: 172.28.22.0/24
  catalog:
    ipam: !override
      config:
        - subnet: 172.28.25.0/24
  auth-egress:
    ipam: !override
      config:
        - subnet: 172.28.27.0/24
  auth-app:
    ipam: !override
      config:
        - subnet: 172.28.28.0/24
