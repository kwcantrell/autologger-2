# GoTrue (auth) for every stack (supabase-services, design D1-D3; drop-unused-supabase-services D1:
# PostgREST, Realtime, Storage and the gateway are gone). Added by docker/scripts/compose-env.sh
# after docker/supabase-db.yaml; each base file declares the `auth-egress` and `auth-app` networks
# on pinned subnets.
#
# Invariant 16 (make check): auth publishes no port and joins exactly `db`, `auth-egress` (alone)
# and `auth-app` (with the app only); its image is digest-pinned; none of the retired services
# (PostgREST, Realtime, Storage, the gateway) and no `supabase` or `edge` network exists; each
# secret value appears only in its allowed services (the table in docker/scripts/compose-run.mjs),
# and no retired key appears.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-svc: &svc
  restart: unless-stopped
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *logging

services:
  auth:
    <<: *svc
    # GoTrue reaches Google over auth-egress and is reached by the app over auth-app (gotrue-sign-in D6).
    networks: [db, auth-egress, auth-app]
    image: supabase/gotrue@sha256:c0c25187a6b835e65a6f6e6c6b39d090e832d40e6de5186f2c038e0411944232 # v2.196.0
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      # drop-unused-supabase-services D2: no browser reaches GoTrue and the server discards the
      # tokens it issues, so its URLs are the internal address, with no published port.
      API_EXTERNAL_URL: http://auth:9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${SUPABASE_ROLES_PASSWORD:?run compose through make}@db:5432/postgres
      GOTRUE_SITE_URL: http://auth:9999
      GOTRUE_URI_ALLOW_LIST: ""
      # Google is the only provider and the only way to create a user (gotrue-sign-in D3): the app
      # exchanges a verified Google ID token for the user. Auto-confirm stays off, so GoTrue links
      # identities by email only for verified addresses. Dev has no client id: every token is refused.
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "true"
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?run compose through make}
      GOTRUE_JWT_ISSUER: http://auth:9999
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 3
    depends_on:
      db: { condition: service_healthy }
