# Supabase API services and gateway for every stack (supabase-services, design D1-D3). Added by
# docker/scripts/compose-env.sh after docker/supabase-db.yaml; each base file declares the
# `supabase` (internal, host-isolated), `edge`, `auth-egress` and `auth-app` networks on pinned
# subnets.
#
# Invariant 16 (make check): only supabase-gw publishes a port and joins `edge`; rest, realtime and
# storage join only `db` and `supabase`; auth also joins `auth-egress` (alone) and `auth-app` (with
# the app only); every image is digest-pinned; each secret
# value appears only in its allowed services (the table in docker/scripts/compose-run.mjs).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-svc: &svc
  restart: unless-stopped
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  networks: [db, supabase]
  logging: *logging

services:
  auth:
    <<: *svc
    # GoTrue reaches Google over auth-egress and is reached by the app over auth-app (gotrue-sign-in D6).
    networks: [db, supabase, auth-egress, auth-app]
    image: supabase/gotrue@sha256:c0c25187a6b835e65a6f6e6c6b39d090e832d40e6de5186f2c038e0411944232 # v2.196.0
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://localhost:${SUPABASE_PORT:?run compose through make}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${SUPABASE_ROLES_PASSWORD:?run compose through make}@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:${SUPABASE_PORT}
      GOTRUE_URI_ALLOW_LIST: ""
      # Google is the only provider and the only way to create a user (gotrue-sign-in D3): the app
      # exchanges a verified Google ID token for the user. Auto-confirm stays off, so GoTrue links
      # identities by email only for verified addresses. Dev has no client id: every token is refused.
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "true"
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?run compose through make}
      GOTRUE_JWT_ISSUER: http://localhost:${SUPABASE_PORT}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 3
    depends_on:
      db: { condition: service_healthy }

  rest:
    <<: *svc
    image: postgrest/postgrest@sha256:c9dc201e555f5d8e37e7f39cdd4df0229774996e213bfd7de8d10ac609030f2c # v14.17
    command: ["postgrest"]
    environment:
      PGRST_DB_URI: postgres://authenticator:${SUPABASE_ROLES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: "3600"
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
    depends_on:
      db: { condition: service_healthy }

  realtime:
    <<: *svc
    image: supabase/realtime@sha256:cbcc6a7986fc28b6dcffa798b077d5fb9c69cd25500371ab49147a86d7edbb03 # v2.134.10
    # Upstream's run.sh needs sudo; this runs its steps as nobody with no capabilities (design D2).
    user: "65534:65534"
    entrypoint: ["sh", "-c", "ulimit -Sn 10000 && /app/bin/migrate && /app/bin/realtime eval 'Realtime.Release.seeds(Realtime.Repo)' && exec /app/bin/server"]
    environment:
      PORT: "4000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD:?run compose through make}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:?run compose through make}
      API_JWT_SECRET: ${JWT_SECRET}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?run compose through make}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"
    healthcheck:
      test: ["CMD", "curl", "-sSfL", "--head", "-o", "/dev/null", "-H", "Authorization: Bearer ${ANON_KEY:?run compose through make}", "http://localhost:4000/api/tenants/realtime-dev/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db: { condition: service_healthy }

  storage:
    <<: *svc
    image: supabase/storage-api@sha256:f1546fac6d1c7e345428ac904bfaa7be7cecd50a1f549fe1cf38c628a7b15c85 # v1.74.0
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?run compose through make}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${SUPABASE_ROLES_PASSWORD}@db:5432/postgres
      STORAGE_PUBLIC_URL: http://localhost:${SUPABASE_PORT}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      GLOBAL_S3_BUCKET: stub
      TENANT_ID: stub
      REGION: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
      S3_PROTOCOL_ENABLED: "false"
    volumes:
      - supabase-storage:/var/lib/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db: { condition: service_healthy }
      rest: { condition: service_started }

  # The only way in from the host (design D3): Host/Origin checks, apikey checks, routing.
  supabase-gw:
    image: caddy@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    restart: unless-stopped
    init: true
    user: "65532:65532"
    read_only: true
    # As the router: the caddy binary's file capability needs NET_BIND_SERVICE in the bounding set.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /data
      - /config
    environment:
      SUPABASE_PORT: ${SUPABASE_PORT}
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    ports:
      - "127.0.0.1:${SUPABASE_PORT}:8000"
    volumes:
      - ./docker/supabase-gw.Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [supabase, edge]
    depends_on:
      auth: { condition: service_healthy }
      rest: { condition: service_healthy }
      realtime: { condition: service_healthy }
      storage: { condition: service_healthy }
    healthcheck:
      # Loopback-only Caddy admin endpoint; not a public path.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging: *logging

volumes:
  supabase-storage:
