# docker/secrets-env.yaml -- the ONE allowlist of variables an app container may receive
# (infisical-secrets design D2). Dev `app` and prod `api` pull it in with `extends`; stage
# inherits prod's `api`. Not a project on its own: never pass it to `docker compose -f`.
#
# Each key is a NULL PASSTHROUGH: compose copies it from the process that runs compose, which
# docker/scripts/compose-run.sh builds from a clean base plus the stack's Infisical environment.
# A key the environment does not set stays unset in the container. A service's own literal pin
# (dev's IP_ALLOWLIST: "", the posture keys) always wins over these.
#
# Adding a key: add it here (one line, `KEY:` with nothing after the colon; check-envs.sh
# invariant 15 and compose-run.sh read these lines), then set it in Infisical. A secret that is
# only meant for another service (e.g. a Supabase service-role key) must NOT be added here.

services:
  secrets:
    environment:
      # D4 sentinel: a hand-typed `docker compose` (no compose-run.sh) fails here instead of
      # starting the app without its secrets. Informational inside the container.
      AUTOLOGGER_STACK: ${AUTOLOGGER_STACK:?run compose through make (docker/scripts/compose-run.sh); secrets come from Infisical}
      # Sign-in and tokens
      GOOGLE_CLIENT_ID:
      GOOGLE_CLIENT_SECRET:
      API_TOKEN:
      ADMIN_TOKEN:
      IP_ALLOWLIST:
      NEW_USER_ALL_TEAMS:
      SESSION_DAYS:
      # Transcription
      DEEPGRAM_API_KEY:
      DEEPGRAM_MODEL:
      # AI chat, topic and event generation, AI v2
      AI_CHAT_MAX_BUDGET_USD:
      AI_CHAT_MAX_CONCURRENT:
      AI_CHAT_TIMEOUT_SEC:
      TOPIC_GENERATE_MAX_BUDGET_USD:
      TOPIC_GENERATE_TIMEOUT_SEC:
      EVENT_GENERATE_MAX_BUDGET_USD:
      EVENT_GENERATE_MAX_CREATED_EVENTS:
      EVENT_GENERATE_MAX_INSTRUCTION_BYTES:
      EVENT_GENERATE_MAX_INSTRUCTION_ENTRIES:
      EVENT_GENERATE_TIMEOUT_SEC:
      AI_V2_ENABLED:
      AI_V2_API_KEY:
      AI_V2_MAX_BUDGET_USD:
      # Sheets log import
      SHEETS_LOG_IMPORT_ENABLED:
